{% extends "base.html" %}
{% block title %}Chat - PCR{% endblock %}
{% block content %}
<div class="app-container">
    <header class="chat-header">
        <div class="header-left">
            <h1>Private Chat Room</h1>
            <span class="status" id="connection-status">Connecting...</span>
        </div>
        <div class="header-right">
            <span class="user-name">{{ user.display_name }}</span>
            {% if user.role == 'admin' %}
                <a href="{{ url_for('admin') }}" class="btn btn-sm icon-btn" title="Admin" aria-label="Admin">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </a>
            {% endif %}
            <a href="{{ url_for('logout') }}" class="btn btn-sm btn-ghost icon-btn" title="Logout" aria-label="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </a>
        </div>
    </header>
    <main class="chat-main">
        <div class="messages" id="messages"></div>
    </main>
    <footer class="chat-footer">
        <div class="input-area">
            <button type="button" class="attach-btn" id="attach-btn" title="Attach file">+</button>
            <input type="file" id="file-input" accept="image/*,video/*,audio/*,.pdf" hidden>
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
            <button type="button" class="voice-btn" id="voice-btn" title="Voice note">🎤</button>
            <button type="button" class="send-btn" id="send-btn">Send</button>
        </div>
        <div class="preview" id="file-preview"></div>
    </footer>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const currentUserId = {{ user.id }};
const currentUserName = "{{ user.display_name }}";
const isAdmin = {{ 'true' if user.role == 'admin' else 'false' }};
const room = "{{ room }}";
</script>
<script src="{{ url_for('static', filename='js/chat.v7.js') }}"></script>
{% endblock %}
